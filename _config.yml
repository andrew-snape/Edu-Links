title: Edu Links
description: A quick-reference hub of planning resources, organised by subject.
url: "https://andrew-snape.github.io"
baseurl: "/edsites"

markdown: kramdown

# Words that keep fixed casing in auto-generated sub-area headings.
# Matched per whole word, so "atlas" is not mangled into "ATLas".
acronyms:
  - ATL
  - PYP
  - IB
  - STEM
  - STEAM
  - ICT
  - BTN
  - PZ

# Order and labels for the top navigation / homepage cards.
# `key` must match a top-level key in _data/links.yml (snake_case).
# `slug` is the URL segment for the page (matches its permalink).
subjects:
  - key: maths
    slug: maths
    title: Maths
    icon: "➗"
  - key: literacy
    slug: literacy
    title: Literacy
    icon: "📖"
  - key: class_utilities
    slug: class-utilities
    title: Class Utilities
    icon: "🧰"
  - key: research
    slug: research
    title: Research
    icon: "🔍"
  - key: pyp
    slug: pyp
    title: PYP
    icon: "🌐"
  - key: christian_studies
    slug: christian-studies
    title: Christian Studies
    icon: "✝️"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
