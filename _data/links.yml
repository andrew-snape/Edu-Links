# Edu Links data file
# ---------------------
# Add/edit links here. Each top-level key must match a `key` entry in
# _config.yml's `subjects` list (and a page's `subject:` front matter).
# Under each subject, group links into any sub-areas you like
# (e.g. "Warm Ups", "Rich Tasks") - headings are created automatically.
#
# Each link needs:
#   title:       shown on the card
#   url:         the website
#   description: a short one-liner
#   logo:        (optional) direct image URL - if omitted, a favicon is
#                fetched automatically from the site's domain

maths:
  Warm Ups:
    - title: Estimation 180
      url: https://www.estimation180.com/
      description: A daily estimation challenge to build number sense.
    - title: Which One Doesn't Belong
      url: https://wodb.ca/
      description: Open-ended sets of four images/numbers to spark discussion.
    - title: Number Talks Images
      url: https://numbertalksimages.wordpress.com/
      description: Dot images and arrays for quick mental-maths talks.
  Rich Tasks:
    - title: NRICH
      url: https://nrich.maths.org/
      description: Rich, open-ended maths problems and investigations by age group.
    - title: Open Middle
      url: https://www.openmiddle.com/
      description: Problems with a fixed start and end but many paths in between.
    - title: youcubed
      url: https://www.youcubed.org/
      description: Jo Boaler's tasks for building a growth mindset in maths.
  Games & Practice:
    - title: Times Tables Rock Stars
      url: https://ttrockstars.com/
      description: Fun, competitive times-tables practice.
    - title: Prodigy Math
      url: https://www.prodigygame.com/
      description: Curriculum-aligned maths practice inside an RPG game.

literacy:
  Reading:
    - title: Storyline Online
      url: https://storylineonline.net/
      description: Picture books read aloud by actors, free to stream.
    - title: Epic!
      url: https://www.getepic.com/
      description: A digital library of books for kids up to age 12.
  Writing:
    - title: Pobble 365
      url: https://www.pobble365.com/
      description: A daily image, question and vocabulary prompt for writing.
  Phonics & Spelling:
    - title: Phonics Play
      url: https://www.phonicsplay.co.uk/
      description: Interactive phonics games and resources.
    - title: Spelling Shed
      url: https://www.spellingshed.com/
      description: Gamified spelling practice linked to word lists.
  Comprehension:
    - title: CommonLit
      url: https://www.commonlit.org/
      description: Free reading passages and comprehension questions.
    - title: Newsela
      url: https://newsela.com/
      description: Levelled current-events articles for comprehension practice.

